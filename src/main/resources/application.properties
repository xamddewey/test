spring.application.name=demo-backend

# ??Docker Compose????
spring.docker.compose.enabled=true

# PostgreSQL ??
spring.datasource.url=jdbc:postgresql://localhost:15432/expense_sharing_app
spring.datasource.username=myapp_user
spring.datasource.password=myapp_password
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis-Flex??
mybatis-flex.mapper-locations=classpath:mapper/*.xml
mybatis-flex.type-aliases-package=com.xdw.demobackend.entity
mybatis-flex.configuration.map-underscore-to-camel-case=true
mybatis-flex.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT??
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000

# ????
logging.level.com.xdw.demobackend=DEBUG
logging.level.org.springframework.security=DEBUG

# ?????
server.port=8080

