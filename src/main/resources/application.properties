# ========================================
# Jimmer Caching Configuration (Optional)
# ========================================
# Jimmer supports multi-level caching for improved performance
# Documentation: https://babyfish-ct.github.io/jimmer-doc/docs/cache/
# 
# Caching is DISABLED by default (safe default)
# Uncomment and configure below to enable caching when needed

# --- Caching Disabled (Default) ---
# jimmer.cache.enabled=false

# --- In-Memory Caching (Development/Testing) ---
# Enables Caffeine-based in-memory cache with fixed size
# Suitable for single-instance applications and testing
# jimmer.cache.enabled=true
# jimmer.cache.type=caffeine
# jimmer.cache.caffeine.maximum-size=1000

# --- Redis Caching (Production/Distributed) ---
# Requires:
# 1. Redis server running and accessible
# 2. spring-boot-starter-data-redis dependency in pom.xml
# 3. Redis connection details configured
# 
# Advantages:
# - Multi-instance cache sharing (distributed caching)
# - Automatic cache invalidation across instances
# - Persistent cache with optional durability
# 
# Setup steps:
# 1. Add dependency: org.springframework.boot:spring-boot-starter-data-redis
# 2. Uncomment lines below and adjust Redis host/port
# 3. Restart application to enable caching
# 
# jimmer.cache.enabled=true
# jimmer.cache.type=redis
# jimmer.cache.redis.host=localhost
# jimmer.cache.redis.port=6379
# jimmer.cache.redis.database=0
# jimmer.cache.redis.password=  # Set if Redis requires authentication

# --- Cache Duration ---
# Cache time-to-live in milliseconds
# Default if not specified: 300000 (5 minutes)
# jimmer.cache.duration=300000

# --- Important Notes ---
# - Caching adds complexity: ensure to test cache invalidation scenarios
# - Monitor cache hit rates and memory usage in production
# - Stale data risk: only enable for entities with predictable change patterns
# - Start with small cache sizes and increase based on metrics
# - Consider disabling for frequently-modified entities
