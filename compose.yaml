version: '3.8'

services:
  postgresql:
    image: postgres:15
    container_name: dev-postgres
    environment:
      POSTGRES_DB: myapp_db
      POSTGRES_USER: myapp_user
      POSTGRES_PASSWORD: myapp_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"  # 使用15432端口避免与本地PostgreSQL冲突
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d  # 可选：初始化脚本目录
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp_user -d myapp_db"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
    name: myapp-network